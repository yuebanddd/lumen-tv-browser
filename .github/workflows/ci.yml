name: Android CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build WebView debug APK
        run: ./gradlew testGenericGeckoExcludedDebugUnitTest assembleGenericGeckoExcludedDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumen-tv-browser-debug
          path: app/build/outputs/apk/genericGeckoExcluded/debug/*.apk
          if-no-files-found: error
